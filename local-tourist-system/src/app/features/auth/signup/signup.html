<section class="signup">
  <div class="panel">
    <p class="eyebrow">New account</p>
    <h1>Sign up</h1>
    <p class="hint">Create a normal user account to plan day trips. Admin access is role-based and not self-assigned.</p>

    <form (ngSubmit)="submit()" novalidate>
      <label>
        Display name
        <input name="displayName" [(ngModel)]="displayName" autocomplete="name" required />
      </label>
      <label>
        Username
        <input name="username" [(ngModel)]="username" autocomplete="username" required />
      </label>
      <label>
        Password
        <input
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="new-password"
          required
        />
      </label>
      <label>
        Confirm password
        <input
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          required
        />
      </label>

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <p class="switch">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>

    <a routerLink="/" class="back">← Continue as guest</a>
  </div>
</section>
