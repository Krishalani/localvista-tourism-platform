<section class="login">
  <div class="panel">
    <p class="eyebrow">Administrator</p>
    <h1>Sign in</h1>
    <p class="hint">Demo credentials: <code>admin</code> / <code>Admin123</code></p>

    <form (ngSubmit)="submit()" novalidate>
      <label>
        Username
        <input name="username" [(ngModel)]="username" autocomplete="username" required />
      </label>
      <label>
        Password
        <input
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />
      </label>

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn btn-primary">Log in</button>
    </form>

    <a routerLink="/" class="back">← Back to LocalVista</a>
  </div>
</section>
