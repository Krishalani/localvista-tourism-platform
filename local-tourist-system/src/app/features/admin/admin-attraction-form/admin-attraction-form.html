<section class="form-page">
  <a routerLink="/admin" class="back">← Back to management</a>
  <h1>{{ isEdit() ? 'Edit attraction' : 'Add attraction' }}</h1>
  <p class="lede">Mandatory fields: name, category, description.</p>

  <form (ngSubmit)="submit()" novalidate>
    <label>
      Name *
      <input name="name" [(ngModel)]="model.name" required />
    </label>

    <label>
      Category *
      <select
        name="category"
        [ngModel]="model.category"
        (ngModelChange)="onCategoryChange($event)"
        required
      >
        @for (category of categories; track category) {
          <option [value]="category">{{ category }}</option>
        }
      </select>
    </label>

    <label>
      Description *
      <textarea name="description" rows="4" [(ngModel)]="model.description" required></textarea>
    </label>

    <div class="row">
      <label>
        Opening hours
        <input name="openingHours" [(ngModel)]="model.openingHours" />
      </label>
      <label>
        Distance from Kandy (km)
        <input name="distanceKm" type="number" min="0" step="0.1" [(ngModel)]="model.distanceKm" />
      </label>
    </div>

    <label>
      Travel tips
      <textarea name="travelTips" rows="3" [(ngModel)]="model.travelTips"></textarea>
    </label>

    <label>
      Image URL
      <input name="imageUrl" [(ngModel)]="model.imageUrl" />
    </label>

    <div class="row">
      <label>
        Latitude
        <input name="latitude" type="number" step="0.0001" [(ngModel)]="model.latitude" />
      </label>
      <label>
        Longitude
        <input name="longitude" type="number" step="0.0001" [(ngModel)]="model.longitude" />
      </label>
    </div>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <div class="actions">
      <a class="btn btn-ghost" routerLink="/admin">Cancel</a>
      <button type="submit" class="btn btn-primary">
        {{ isEdit() ? 'Save changes' : 'Create attraction' }}
      </button>
    </div>
  </form>
</section>
